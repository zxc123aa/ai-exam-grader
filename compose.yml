services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  redis:
    image: redis:8-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  reference-algorithm:
    build:
      context: ./参考算法/2_试卷分析文件
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: "3417"
      DEFAULT_PROVIDER: ${VISION_DEFAULT_PROVIDER:-pomoai}
      DEFAULT_MODEL: ${VISION_DEFAULT_MODEL:-gemini-3.5-flash}
      AVAILABLE_PROVIDERS: pomoai,fluxnode_gemini,fluxnode_grok,kimi
      PROVIDER_POMOAI_BASE_URL: ${PROVIDER_POMOAI_BASE_URL:-https://www.pomoai.ai}
      PROVIDER_POMOAI_API_KEY: ${PROVIDER_POMOAI_API_KEY:-}
      PROVIDER_POMOAI_MODELS: gemini-3.5-flash,gemini-3.6-flash,gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.5
      PROVIDER_FLUXNODE_GEMINI_BASE_URL: ${PROVIDER_FLUXNODE_GEMINI_BASE_URL:-https://fluxnode.org}
      PROVIDER_FLUXNODE_GEMINI_API_KEY: ${PROVIDER_FLUXNODE_GEMINI_API_KEY:-}
      PROVIDER_FLUXNODE_GEMINI_MODELS: gemini-3.5-flash,gemini-3.6-flash
      PROVIDER_FLUXNODE_GROK_BASE_URL: ${PROVIDER_FLUXNODE_GROK_BASE_URL:-https://fluxnode.org}
      PROVIDER_FLUXNODE_GROK_API_KEY: ${PROVIDER_FLUXNODE_GROK_API_KEY:-}
      PROVIDER_FLUXNODE_GROK_MODELS: grok-4.5
      PROVIDER_KIMI_BASE_URL: ${PROVIDER_KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      PROVIDER_KIMI_API_KEY: ${PROVIDER_KIMI_API_KEY:-}
      PROVIDER_KIMI_MODELS: kimi-k2.7-code,kimi-k2.7-code-highspeed,kimi-k2.6,kimi-k2.5
      MODEL_TIMEOUT_MS: ${VISION_TIMEOUT_SECONDS:-180}000
      MAX_CONCURRENT_OCR: ${VISION_MAX_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3417/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ocr-service:
    profiles:
      - ocr-gpu
    build:
      context: .
      dockerfile: ocr-service/Dockerfile.gpu-cu130
    restart: always
    networks:
      - default
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ocr-model-cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=${REDIS_URL}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_UPLOAD_DIR=/app/data/uploads
      - STORAGE_CACHE_DIR=/app/data/storage-cache
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_PREFIX=${OSS_PREFIX:-dianfan}
      - WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID:-}
      - WECHAT_PAY_APP_ID=${WECHAT_PAY_APP_ID:-}
      - WECHAT_PAY_CERT_SERIAL_NO=${WECHAT_PAY_CERT_SERIAL_NO:-}
      - WECHAT_PAY_PRIVATE_KEY_PEM=${WECHAT_PAY_PRIVATE_KEY_PEM:-}
      - WECHAT_PAY_PLATFORM_CERT_PEM=${WECHAT_PAY_PLATFORM_CERT_PEM:-}
      - WECHAT_PAY_API_V3_KEY=${WECHAT_PAY_API_V3_KEY:-}
      - WECHAT_PAY_NOTIFY_URL=${WECHAT_PAY_NOTIFY_URL:-}
      - OCR_ENGINE=${OCR_ENGINE:-disabled}
      - OCR_HTTP_URL=${OCR_HTTP_URL:-http://ocr-service:8010/ocr}
      - SCAN_ENGINE=${SCAN_ENGINE:-scan_stable_v1}
      - SCAN_HTTP_URL=${SCAN_HTTP_URL:-http://ocr-service:8010/preprocess}
      - REFERENCE_ALGORITHM_URL=http://reference-algorithm:3417

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      reference-algorithm:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=${REDIS_URL}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_UPLOAD_DIR=/app/data/uploads
      - STORAGE_CACHE_DIR=/app/data/storage-cache
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_PREFIX=${OSS_PREFIX:-dianfan}
      - WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID:-}
      - WECHAT_PAY_APP_ID=${WECHAT_PAY_APP_ID:-}
      - WECHAT_PAY_CERT_SERIAL_NO=${WECHAT_PAY_CERT_SERIAL_NO:-}
      - WECHAT_PAY_PRIVATE_KEY_PEM=${WECHAT_PAY_PRIVATE_KEY_PEM:-}
      - WECHAT_PAY_PLATFORM_CERT_PEM=${WECHAT_PAY_PLATFORM_CERT_PEM:-}
      - WECHAT_PAY_API_V3_KEY=${WECHAT_PAY_API_V3_KEY:-}
      - WECHAT_PAY_NOTIFY_URL=${WECHAT_PAY_NOTIFY_URL:-}
      - OCR_ENGINE=${OCR_ENGINE:-disabled}
      - OCR_HTTP_URL=${OCR_HTTP_URL:-http://ocr-service:8010/ocr}
      - SCAN_ENGINE=${SCAN_ENGINE:-scan_stable_v1}
      - SCAN_HTTP_URL=${SCAN_HTTP_URL:-http://ocr-service:8010/preprocess}
      - REFERENCE_ALGORITHM_URL=http://reference-algorithm:3417

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data/uploads:/app/data/uploads
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  worker:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      reference-algorithm:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - REDIS_URL=${REDIS_URL}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_UPLOAD_DIR=/app/data/uploads
      - STORAGE_CACHE_DIR=/app/data/storage-cache
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_PREFIX=${OSS_PREFIX:-dianfan}
      - OCR_ENGINE=${OCR_ENGINE:-disabled}
      - OCR_HTTP_URL=${OCR_HTTP_URL:-http://ocr-service:8010/ocr}
      - SCAN_ENGINE=${SCAN_ENGINE:-scan_stable_v1}
      - SCAN_HTTP_URL=${SCAN_HTTP_URL:-http://ocr-service:8010/preprocess}
      - REFERENCE_ALGORITHM_URL=http://reference-algorithm:3417
    command:
      - dramatiq
      - app.worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data/uploads:/app/data/uploads

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - VITE_PUBLIC_SIGNUP_ENABLED=${PUBLIC_SIGNUP_ENABLED:-false}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:
  ocr-model-cache:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true

<!doctype html>
<html>
  <body style="background-color:#fafbfc; font-family:Arial, Helvetica, sans-serif;">
    <div style="background-color:#fff; padding:40px 20px; text-align:center; color:#555;">
      <h1 style="font-size:20px; color:#333; padding:35px;">{{ project_name }} - New Account</h1>
      <p style="font-size:16px;">Welcome to your new account!</p>
      <p style="font-size:16px;">Here are your account details:</p>
      <p style="font-size:16px;">Username: {{ username }}</p>
      <p style="font-size:16px;">Password: {{ password }}</p>
      <p>
        <a href="{{ link }}" style="display:inline-block; font-size:18px; background-color:#009688; border-radius:8px; color:#fff; padding:15px 30px; text-decoration:none;">Go to Dashboard</a>
      </p>
      <hr style="border-color:#ccc; border-width:2px;">
    </div>
  </body>
</html>

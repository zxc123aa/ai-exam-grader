name: Release Images

# 打 v* tag 时构建不可变镜像并推到 ghcr，按 tag 与提交 SHA 双标记。
# docs/production-operations.md 要求「CI 通过后构建不可变镜像、回滚只切镜像」，
# 这条工作流是那两条的产出方，服务器上不再需要现构建。
#
# 后端镜像不含构建期变量，天然与环境无关。前端不同：VITE_* 会被 vite
# 编译进产物，所以镜像是绑定环境的，地址来自仓库变量而不是硬编码。

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 发布镜像刻意不复用 GHA 构建缓存：缓存对 tag 工作流是可投毒面，
      # 且发布产物要求干净构建。
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/dianfan-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dianfan-backend:${{ github.sha }}

  # staging 的第三个镜像。不发布它，服务器就仍然被迫现构建一部分，
  # 「回滚只切镜像」也就不成立。
  reference-algorithm:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # buildx 把上下文路径塞进 gRPC 头 x-docker-expose-session-sharedkey，
      # 中文目录名会让它以「contains value with non-printable ASCII
      # characters」直接失败，所以先把上下文原样复制到纯 ASCII 路径。
      # Dockerfile 里的 COPY 是相对上下文的，不能改用仓库根目录当上下文，
      # 否则 package.json 会落到 npm workspace 根上。
      - name: Stage build context on an ASCII path
        run: |
          mkdir -p release-context/reference-algorithm
          cp -a 参考算法/2_试卷分析文件/. release-context/reference-algorithm/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: release-context/reference-algorithm
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/dianfan-reference-algorithm:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dianfan-reference-algorithm:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 空的 VITE_API_URL 会静默烤进前端产物，部署后表现为接口全部请求失败，
      # 所以宁可在这里就断掉。
      - name: Require release API URL
        env:
          VITE_API_URL: ${{ vars.RELEASE_VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "缺少仓库变量 RELEASE_VITE_API_URL（例如 https://api.example.com）。" >&2
            echo "前端把 API 地址编译进产物，这个值不能为空。" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=${{ vars.RELEASE_VITE_API_URL }}
            VITE_PUBLIC_SIGNUP_ENABLED=false
            VITE_TURNSTILE_SITE_KEY=${{ vars.RELEASE_TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dianfan-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dianfan-frontend:${{ github.sha }}

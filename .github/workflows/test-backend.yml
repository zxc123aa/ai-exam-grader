name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # tests/conftest.py 会拒绝在库名不含 test 的数据库上执行清库
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PROJECT_NAME: 点凡阅卷
      ENVIRONMENT: local
      SECRET_KEY: github-actions-secret-key-not-used-anywhere-else
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: github-actions-superuser-password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
      REDIS_URL: redis://localhost:6379/0
      # 与 .env.example 的本地开发配置一致：测试数据没有学校合同，
      # 计费门禁保持关闭；账单与商业化测试自己 monkeypatch 打开开关。
      BILLING_ENFORCEMENT_ENABLED: "false"
      TOKEN_BUDGET_ENFORCEMENT_ENABLED: "false"
      # 找回密码用例要求邮件配置可用，但不会真的投递出去。
      EMAILS_FROM_EMAIL: noreply@example.com
      STORAGE_BACKEND: local
      OCR_ENGINE: disabled

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Run tests
        run: uv run bash scripts/tests-start.sh
        working-directory: backend

      - name: Check OpenAPI paths
        run: uv run python scripts/smoke-openapi.py
        env:
          PYTHONPATH: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/htmlcov
          retention-days: 7
          if-no-files-found: ignore
